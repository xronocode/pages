<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="300" fill="#fff" rx="6"/>

  <!-- Left panel: Full attention -->
  <text x="180" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#3b82f6">Full attention</text>
  <text x="180" y="56" text-anchor="middle" font-size="12" fill="#888">short context</text>

  <!-- Top row tokens (light blue) -->
  <circle cx="40" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="80" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="120" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="160" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="200" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="240" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="280" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="320" cy="100" r="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Lines from top row to active token -->
  <line x1="40" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="80" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="160" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>
  <line x1="240" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="280" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="114" x2="200" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>

  <!-- Bottom row tokens (gray) + active (blue) -->
  <circle cx="40" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="80" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="120" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="160" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="240" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="280" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Left legend -->
  <circle cx="50" cy="258" r="8" fill="#2563eb"/>
  <text x="64" y="262" font-size="11" fill="#555">active token</text>
  <circle cx="160" cy="258" r="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="174" y="262" font-size="11" fill="#555">everyone sees everyone</text>

  <!-- Divider -->
  <line x1="360" y1="20" x2="360" y2="280" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right panel: Sparse attention -->
  <text x="540" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#10b981">Sparse attention</text>
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="#888">long context</text>

  <!-- Top row: mix of types -->
  <!-- global anchor (orange) -->
  <circle cx="400" cy="100" r="14" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
  <!-- gray (not connected) -->
  <circle cx="440" cy="100" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="480" cy="100" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <!-- local neighbors (teal) -->
  <circle cx="520" cy="100" r="14" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <circle cx="560" cy="100" r="14" fill="#d1fae5" stroke="#34d399" stroke-width="1.5"/>
  <!-- local neighbors -->
  <circle cx="600" cy="100" r="14" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.5"/>
  <!-- gray -->
  <circle cx="640" cy="100" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="680" cy="100" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Lines: global anchor (dashed orange) -->
  <line x1="400" y1="114" x2="560" y2="186" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- Lines: local neighbors (teal) -->
  <line x1="520" y1="114" x2="560" y2="186" stroke="#2dd4bf" stroke-width="1.2" opacity="0.7"/>
  <line x1="560" y1="114" x2="560" y2="186" stroke="#2dd4bf" stroke-width="1.5" opacity="0.8"/>
  <line x1="600" y1="114" x2="560" y2="186" stroke="#2dd4bf" stroke-width="1.2" opacity="0.7"/>

  <!-- Bottom row -->
  <circle cx="400" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="440" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="480" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="520" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="560" cy="200" r="18" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="600" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="640" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="680" cy="200" r="14" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Right legend -->
  <circle cx="410" cy="258" r="8" fill="#2563eb"/>
  <text x="424" y="262" font-size="11" fill="#555">active token</text>
  <circle cx="510" cy="258" r="8" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
  <text x="524" y="262" font-size="11" fill="#555">local neighbors</text>
  <circle cx="640" cy="258" r="8" fill="#fed7aa" stroke="#fb923c" stroke-width="1"/>
  <text x="654" y="262" font-size="11" fill="#555">global anchor</text>
</svg>
